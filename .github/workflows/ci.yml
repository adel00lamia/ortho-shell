name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  supabase-types:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Generate types
        run: |
          supabase gen types typescript \
            --project-id "${{ secrets.SUPABASE_PROJECT_ID }}" \
            --schema public \
            > src/integrations/supabase/types.generated.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Check for type drift
        run: |
          if git diff --quiet src/integrations/supabase/types.generated.ts 2>/dev/null; then
            echo "Types are up to date"
          else
            echo "::warning::Supabase types have drifted. Run 'supabase gen types' locally to update."
          fi
